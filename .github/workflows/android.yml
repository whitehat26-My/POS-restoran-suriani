name: Android APK

# Separate from the fast typecheck/lint/test workflow on purpose: an Android
# build takes minutes and pulls down an SDK, and it must never be the thing
# standing between a one-line fix and a green tick.
on:
  # `push` is main-only and `pull_request` covers branches, so a branch with an
  # open PR builds once rather than twice. The first run of this workflow did
  # exactly that: two identical APKs, two runners, one useful result.
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/pos-android/**'
      - 'apps/pos/**'
      - 'packages/printer/**'
      - 'packages/offline/**'
      - 'packages/core/**'
      - '.github/workflows/android.yml'
  # For an APK of a commit the paths filter skipped.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install
        run: pnpm install --frozen-lockfile

      # The transport choice — LAN first, Bluetooth when the router dies — is
      # plain TypeScript and is tested here rather than on a device.
      - name: Test the print logic
        run: pnpm --filter @suriani/printer test

      # Builds the till with a relative base and copies it into the native
      # project's assets. Inside the APK the app is served from the device
      # root, not from /pos/ as it is on the Worker.
      - name: Build the till and sync Capacitor
        run: pnpm --filter @suriani/pos-android sync

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/pos-android/android

      - uses: actions/upload-artifact@v4
        with:
          name: suriani-pos-debug-apk
          path: apps/pos-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
